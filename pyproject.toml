[build-system]

requires = ["setuptools>=69", "wheel"]

build-backend = "setuptools.build_meta"



[project]

name = "dual-swinord"

version = "0.1.0"

description = "Faithful reproduction of Dual-SwinOrd for ordinal diabetic retinopathy grading"

readme = "README.md"

requires-python = ">=3.10,<3.13"

license = {text = "MIT"}

authors = [{name = "RetinaGrade Team"}]

dependencies = [

  "albumentations>=1.4",

  "matplotlib>=3.9",

  "numpy>=1.26",

  "opencv-python-headless>=4.10",

  "pandas>=2.2",

  "Pillow>=11.0",

  "PyYAML>=6.0",

  "scikit-learn>=1.5",

  "seaborn>=0.13",

  "timm>=1.0",

  "torch>=2.5",

  "torchvision>=0.20",

  "tqdm>=4.67",

]



[project.optional-dependencies]

dev = [

  "pytest>=8.3",

  "ruff>=0.8",

]

data = [

  "kaggle>=1.6",

]



[tool.setuptools.packages.find]

where = ["."]

include = ["src", "src.*"]



[tool.pytest.ini_options]

testpaths = ["tests"]

addopts = "-q"



[tool.ruff]

line-length = 100

target-version = "py310"



[tool.ruff.lint]

select = ["E", "F", "I", "UP", "B"]

ignore = ["E501"]

