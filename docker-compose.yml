services:
  backend:
    build:
      context: .
      target: runtime-cpu
    environment:
      RETINAGRADE_DEVICE: auto
      RETINAGRADE_CHECKPOINT: /models/model_inference.pt
      RETINAGRADE_MAX_UPLOAD_MB: 15
    volumes:
      - ./outputs/checkpoints/deployment/model_inference.pt:/models/model_inference.pt:ro
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
